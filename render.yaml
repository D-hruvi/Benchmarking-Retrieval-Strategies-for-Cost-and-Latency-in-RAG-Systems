services:
  - type: web
    name: rag-benchmark-demo
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: GROQ_API_KEY
        sync: false   # set manually in Render's dashboard, never committed
      - key: PYTHON_VERSION
        value: 3.11.9
